map $request_uri $caminho_invalido {
    default 0;
    ~^[^?]*[%\\x5c] 1;
    ~^[^?]*// 1;
    "~^[^?]*/\.{1,2}(?:/|\?|$)" 1;
}

# Evita registrar URL, query string, endereços e cabeçalhos em logs.
log_format operacao '$request_method $status $request_time';

upstream java {
    zone java 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8080 resolve;
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/evolia;
    server_tokens off;
    access_log /dev/stdout operacao;
    error_log /dev/stderr crit;

    include /etc/nginx/conf.d/evolia-headers.inc;
    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css;

    error_page 404 = @nao_encontrado;
    error_page 400 = @requisicao_invalida;
    error_page 413 = @corpo_grande;
    error_page 414 = @uri_grande;
    error_page 429 = @muitas_tentativas;
    error_page 502 = @indisponivel;
    error_page 504 = @tempo_limite;

    if ($caminho_invalido) { return 404; }

    location = /healthz {
        default_type text/plain;
        if (!-f $document_root/index.html) { return 503; }
        return 200 "ok\n";
    }

    location = /api/login {
        if ($request_method != POST) { return 404; }
        limit_req_status 429;
        include /etc/nginx/conf.d/login-rajada.inc;
        client_max_body_size 4k;
        include /etc/nginx/conf.d/proxy-java.inc;
    }

    location = /api/logout {
        if ($request_method != POST) { return 404; }
        include /etc/nginx/conf.d/proxy-java.inc;
    }

    location ~ "^/api/(?:csrf|me(?:/consentimento)?|colaboradores(?:/[A-Za-z0-9_.-]+(?:/conta)?)?|cursos(?:/[A-Za-z0-9_.-]+)?|treinamentos(?:/[A-Za-z0-9_.-]+)?|ia/(?:classificacoes|recomendacoes|orientacoes))$" {
        include /etc/nginx/conf.d/proxy-java.inc;
    }

    location ~ "^/(?:|inicio|entrar|competencias|recomendacoes|orientacao|consentimento|cursos(?:/[A-Za-z0-9_.-]+)?|admin/(?:contas|colaboradores(?:/[A-Za-z0-9_.-]+)?|treinamentos(?:/[A-Za-z0-9_.-]+)?))/?$" {
        include /etc/nginx/conf.d/evolia-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2|svg|png|webp|avif)$" {
        include /etc/nginx/conf.d/evolia-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        include /etc/nginx/conf.d/evolia-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / { return 404; }

    location @nao_encontrado {
        include /etc/nginx/conf.d/evolia-headers.inc;
        add_header Cache-Control "no-store" always;
        types {}
        default_type application/problem+json;
        return 404 '{"title":"Rota não encontrada","status":404}';
    }

    location @indisponivel {
        include /etc/nginx/conf.d/evolia-headers.inc;
        add_header Cache-Control "no-store" always;
        types {}
        default_type application/problem+json;
        return 502 '{"title":"Serviço indisponível","status":502}';
    }

    location @tempo_limite {
        include /etc/nginx/conf.d/evolia-headers.inc;
        add_header Cache-Control "no-store" always;
        types {}
        default_type application/problem+json;
        return 504 '{"title":"Tempo de resposta excedido","status":504}';
    }

    location @muitas_tentativas {
        include /etc/nginx/conf.d/evolia-headers.inc;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "1" always;
        types {}
        default_type application/problem+json;
        return 429 '{"title":"Muitas tentativas de entrada","status":429}';
    }

    location @requisicao_invalida {
        types {}
        default_type application/problem+json;
        return 400 '{"title":"Requisição inválida","status":400}';
    }

    location @corpo_grande {
        types {}
        default_type application/problem+json;
        return 413 '{"title":"Corpo da requisição excede o limite","status":413}';
    }

    location @uri_grande {
        types {}
        default_type application/problem+json;
        return 414 '{"title":"Caminho da requisição excede o limite","status":414}';
    }
}
