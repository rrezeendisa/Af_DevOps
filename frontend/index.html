<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/marca/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/marca/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/src/assets/marca/favicon-48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Evolia: inteligência que desenvolve pessoas." />
    <title>Evolia</title>
    <!--
      Aplica o tema antes do primeiro paint, para evitar troca brusca na inicialização.
      Mantenha em sincronia com src/lib/tema.ts. CSP futura (Nginx): este script inline exige
      o hash SHA-256 dele em script-src (ver frontend/DESIGN_SYSTEM.md, seção 10).
    -->
    <script>
      (function () {
        var preferencia = null
        try {
          preferencia = window.localStorage.getItem('evolia:tema')
        } catch (erro) {}
        var escuro =
          preferencia === 'escuro' ||
          (preferencia !== 'claro' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var raiz = document.documentElement
        raiz.classList.toggle('dark', escuro)
        raiz.style.colorScheme = escuro ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
