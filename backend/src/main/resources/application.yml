logging:
  level:
    # O agregador do Spring AI registra a exceção bruta. O adaptador registra somente o resultado da operação.
    org.springframework.ai.chat.model.MessageAggregator: "OFF"

spring:
  ai:
    model:
      embedding: none
    chat:
      client:
        tool-calling:
          enabled: false
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
    ollama:
      base-url: "${OLLAMA_BASE_URL:http://127.0.0.1:11434}"
      init:
        pull-model-strategy: never
      chat:
        model: "${OLLAMA_MODEL:qwen2.5:1.5b}"
        format: json
        temperature: ${OLLAMA_TEMPERATURE:0.2}
        num-predict: ${OLLAMA_NUM_PREDICT:128}
        num-ctx: ${OLLAMA_NUM_CTX:1024}
  application:
    name: afdevops
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:afdevops}"
    username: "${DB_USERNAME:afdevops}"
    password: "${DB_PASSWORD}"
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    # URL AMQP completa, no mesmo formato usado pelo worker Python.
    # No Compose: amqp://<usuario>:<senha>@rabbitmq:5672/%2F
    addresses: "${RABBITMQ_URL:amqp://localhost:5672}"
    connection-timeout: 5s
    publisher-confirm-type: simple
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false

afdevops:
  ia:
    url: "${AI_SERVICE_URL:http://127.0.0.1:8000}"
    token: "${INTERNAL_API_TOKEN:}"
    timeout-conexao: "${AI_SERVICE_CONNECT_TIMEOUT:PT2S}"
    timeout-leitura: "${AI_SERVICE_READ_TIMEOUT:PT5S}"
    generativa:
      habilitada: ${IA_GENERATIVA_HABILITADA:false}
      timeout: "${OLLAMA_TIMEOUT:PT60S}"

server:
  address: "${SERVER_ADDRESS:127.0.0.1}"
  port: 8080
  servlet:
    session:
      # Sessões em memória, com expiração por inatividade. Reiniciar o backend encerra todas.
      timeout: "${SESSION_TIMEOUT:30m}"
      tracking-modes: cookie
      cookie:
        name: EVOLIA_SESSAO
        http-only: true
        same-site: strict
        # true quando o acesso for por HTTPS; false para a demonstração em loopback.
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  health:
    rabbit:
      # Desligado por padrão para o backend subir sem broker no desenvolvimento
      # local; o Docker Compose habilita para refletir a saúde do RabbitMQ.
      enabled: ${RABBITMQ_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        include: health
