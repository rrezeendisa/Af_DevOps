spring:
  application:
    name: afdevops
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:afdevops}"
    username: "${DB_USERNAME:afdevops}"
    password: "${DB_PASSWORD}"
    hikari:
      data-source-properties:
        logServerErrorDetail: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    # URL AMQP completa, no mesmo formato usado pelo worker Python.
    # No Compose: amqp://<usuario>:<senha>@rabbitmq:5672/%2F
    addresses: "${RABBITMQ_URL:amqp://localhost:5672}"
    connection-timeout: 5s
    publisher-confirm-type: simple
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false

server:
  address: "${SERVER_ADDRESS:127.0.0.1}"
  port: 8080

management:
  health:
    rabbit:
      # Desligado por padrão para o backend subir sem broker no desenvolvimento
      # local; o Docker Compose habilita para refletir a saúde do RabbitMQ.
      enabled: ${RABBITMQ_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        include: health
