spring:
  application:
    name: afdevops
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:afdevops}"
    username: "${DB_USERNAME:afdevops}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        include: health
