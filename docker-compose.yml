# Ambiente integrado do AF-DevOps (Frente C — DevOps e QA).
#
# Primeiro uso: bash scripts/gerar-env.sh
# Inicialização completa: docker compose up --build
# Apenas o gateway publica uma porta, em loopback.

name: afdevops

x-ai-service-build: &ai-service-build
  context: ./ai-service
  dockerfile: Dockerfile

x-ollama-image: &ollama-image ollama/ollama:0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec

services:
  gateway:
    build:
      context: ./frontend
    image: evolia-gateway:local
    restart: unless-stopped
    environment:
      # POST /api/login por endereço de origem: taxa sustentada e rajada tolerada.
      LOGIN_RATE: ${LOGIN_RATE:-10r/s}
      LOGIN_BURST: ${LOGIN_BURST:-50}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8088}:8080"
    networks:
      - borda
      - entrada
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-afdevops}
      POSTGRES_USER: ${DB_USERNAME:-afdevops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dados
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    # O nome do nó (e o diretório de dados) depende do hostname; fixá-lo
    # preserva filas e mensagens duráveis entre recriações do container.
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-afdevops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - treinamento
    # Testa as portas AMQP e de gerenciamento sem usar a CLI do RabbitMQ: o
    # healthcheck roda como root e a CLI criaria um .erlang.cookie com dono
    # root antes do broker, impedindo a inicialização (erro eacces).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5672 && exec 4<>/dev/tcp/127.0.0.1/15672"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  # Job único: aplica exchange, filas, binding e políticas (infra/rabbitmq).
  rabbitmq-setup:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/definitions/setup.sh"]
    restart: "no"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-afdevops}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
    volumes:
      - ./infra/rabbitmq:/definitions:ro
    networks:
      - treinamento
    depends_on:
      rabbitmq:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    image: afdevops-backend:local
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-afdevops}
      DB_USERNAME: ${DB_USERNAME:-afdevops}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      AFDEVOPS_ADMIN_USERNAME: ${AFDEVOPS_ADMIN_USERNAME:?Defina AFDEVOPS_ADMIN_USERNAME no .env}
      AFDEVOPS_ADMIN_PASSWORD_HASH: ${AFDEVOPS_ADMIN_PASSWORD_HASH:?Defina AFDEVOPS_ADMIN_PASSWORD_HASH no .env}
      AFDEVOPS_COLABORADOR_USERNAME: ${AFDEVOPS_COLABORADOR_USERNAME:?Defina AFDEVOPS_COLABORADOR_USERNAME no .env}
      AFDEVOPS_COLABORADOR_PASSWORD_HASH: ${AFDEVOPS_COLABORADOR_PASSWORD_HASH:?Defina AFDEVOPS_COLABORADOR_PASSWORD_HASH no .env}
      # Publicação das solicitações de treinamento e rota interna do worker.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-afdevops}:${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}@rabbitmq:5672/%2F
      RABBITMQ_HEALTH_ENABLED: "true"
      # Use true somente quando o acesso ao gateway for por HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Defina INTERNAL_API_TOKEN no .env}
      AI_SERVICE_URL: http://ai-service:8000
      IA_GENERATIVA_HABILITADA: ${IA_GENERATIVA_HABILITADA:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.2}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-128}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-1024}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-PT60S}
    networks:
      - dados
      - entrada
      - ia
      - treinamento
      - generativa
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  ai-service:
    build: *ai-service-build
    image: afdevops-ai-service:local
    command: ["api"]
    restart: unless-stopped
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Defina INTERNAL_API_TOKEN no .env}
    volumes:
      - ai-artifacts:/data/artifacts
    networks:
      - ia
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ai-worker:
    build: *ai-service-build
    image: afdevops-ai-service:local
    command: ["worker"]
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-afdevops}:${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no .env}@rabbitmq:5672/%2F
      JAVA_BACKEND_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Defina INTERNAL_API_TOKEN no .env}
      MAX_MESSAGE_RETRIES: ${MAX_MESSAGE_RETRIES:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Mesmo volume da API: o modelo treinado pelo worker e o ledger de
    # idempotência sobrevivem à recriação dos containers.
    volumes:
      - ai-artifacts:/data/artifacts
    networks:
      - treinamento
    depends_on:
      rabbitmq-setup:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  ollama:
    image: *ollama-image
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - generativa
      - download
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$${OLLAMA_MODEL}\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20m

  ollama-modelo:
    image: *ollama-image
    entrypoint: ["sh", "/ollama/preparar-modelo.sh"]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    volumes:
      - ./infra/ollama/preparar-modelo.sh:/ollama/preparar-modelo.sh:ro
    networks:
      - generativa
    depends_on:
      ollama:
        condition: service_started

networks:
  borda:
  entrada:
    internal: true
  dados:
    internal: true
  ia:
    internal: true
  treinamento:
    internal: true
  generativa:
    internal: true
  download:

volumes:
  postgres-data:
  rabbitmq-data:
  ai-artifacts:
  ollama-data:
